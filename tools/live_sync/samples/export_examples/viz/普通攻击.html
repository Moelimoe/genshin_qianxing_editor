</svg><div style="position:absolute;top:10px;right:10px;display:flex;gap:4px;"><button onclick="zoomIn('svg-graph-0')" style="background:#333;color:#ccc;border:1px solid #555;padding:4px 8px;cursor:pointer;border-radius:4px;font-size:12px;">🔍+</button><button onclick="zoomOut('svg-graph-0')" style="background:#333;color:#ccc;border:1px solid #555;padding:4px 8px;cursor:pointer;border-radius:4px;font-size:12px;">🔍-</button><button onclick="resetView('svg-graph-0')" style="background:#333;color:#ccc;border:1px solid #555;padding:4px 8px;cursor:pointer;border-radius:4px;font-size:12px;">⟲</button></div></div>

<script>
let svgState = {};

function initSVG(svgId) {
    svgState[svgId] = {scale: 1, tx: 0, ty: 0, dragging: false, startX: 0, startY: 0};
}
initSVG("svg-graph-0");
</script>
<script>
function startPan(e, svgId) {
    const svg = document.getElementById(svgId);
    const state = svgState[svgId];
    if (!state) return;
    state.dragging = true;
    state.startX = e.clientX - state.tx;
    state.startY = e.clientY - state.ty;
    svg.style.cursor = 'grabbing';

    function onMove(ev) {
        if (!state.dragging) return;
        state.tx = ev.clientX - state.startX;
        state.ty = ev.clientY - state.startY;
        applyTransform(svgId);
    }
    function onUp() {
        state.dragging = false;
        svg.style.cursor = 'grab';
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
}

function applyTransform(svgId) {
    const state = svgState[svgId];
    if (!state) return;
    const svg = document.getElementById(svgId);
    svg.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
    svg.style.transformOrigin = '0 0';
}

function zoomIn(svgId) {
    const state = svgState[svgId];
    if (!state) return;
    state.scale = Math.min(state.scale * 1.2, 5);
    applyTransform(svgId);
}

function zoomOut(svgId) {
    const state = svgState[svgId];
    if (!state) return;
    state.scale = Math.max(state.scale / 1.2, 0.1);
    applyTransform(svgId);
}

function resetView(svgId) {
    const state = svgState[svgId];
    if (!state) return;
    state.scale = 1;
    state.tx = 0;
    state.ty = 0;
    applyTransform(svgId);
}

// 滚轮缩放
document.getElementById("svg-graph-0").addEventListener('wheel', function(e) {
    e.preventDefault();
    const state = svgState["svg-graph-0"];
    if (!state) return;
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    state.scale = Math.max(0.1, Math.min(5, state.scale * factor));
    applyTransform("svg-graph-0");
});
</script>

</body>
